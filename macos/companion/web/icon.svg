<svg xmlns="http://www.w3.org/2000/svg" width="824" height="824" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f6b"/>
      <stop offset="1" stop-color="#1b1d33"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2524f"/><stop offset="1" stop-color="#b8312f"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b25c"/><stop offset="1" stop-color="#d98f2e"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb6f0"/><stop offset="1" stop-color="#4f8fd6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <ellipse cx="512" cy="180" rx="520" ry="260" fill="#ffffff" opacity="0.06"/>
  </g>
  <!-- shelf -->
  <rect x="236" y="742" width="552" height="26" rx="13" fill="#ffffff" opacity="0.18"/>
  <g filter="url(#sh)">
    <rect x="262" y="290" width="124" height="452" rx="22" fill="url(#b1)"/>
    <rect x="262" y="350" width="124" height="18" fill="#ffffff" opacity="0.35"/>
    <rect x="262" y="664" width="124" height="18" fill="#ffffff" opacity="0.35"/>
    <rect x="402" y="360" width="110" height="382" rx="20" fill="url(#b2)"/>
    <rect x="402" y="412" width="110" height="16" fill="#ffffff" opacity="0.35"/>
    <g transform="rotate(-12 528 742)">
      <rect x="528" y="330" width="112" height="412" rx="20" fill="url(#b3)"/>
      <rect x="528" y="384" width="112" height="16" fill="#ffffff" opacity="0.35"/>
      <rect x="528" y="668" width="112" height="16" fill="#ffffff" opacity="0.35"/>
    </g>
  </g>
  <g filter="url(#sh)">
    <line x1="700" y1="640" x2="790" y2="730" stroke="#f4f4f8" stroke-width="44" stroke-linecap="round"/>
    <circle cx="640" cy="580" r="108" fill="#ffffff" fill-opacity="0.22" stroke="#f4f4f8" stroke-width="34"/>
  </g>
</svg>
