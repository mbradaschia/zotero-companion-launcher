name: CI

# The Omarchy launcher, the bridge and contracts/ (the Mac app has .github/workflows/macos.yml).
on:
  push:
    branches: [master]
    paths-ignore: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths-ignore: ["macos/**", ".github/workflows/macos.yml"]

permissions:
  contents: read

# A newer push to a pull request stops the run of the push before it; a run on master is never stopped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versions agree
        run: scripts/check-versions.sh

      - name: The prompt runner's packages (the provider tests use the AI SDK's mock model)
        run: npm ci --prefix daemon --no-audit --no-fund

      - name: Unit tests
        run: make test

      - name: Lint (JavaScript and scripts; QML needs qmllint)
        run: |
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools >/dev/null || true
          QMLLINT=$(command -v qmllint6 || echo /usr/lib/qt6/bin/qmllint) make lint

      - name: Build the .xpi
        run: |
          scripts/build-xpi.sh
          git checkout -- zotero-bridge/updates.json # a build between releases rewrites it; releases commit it

      - uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: dist/*.xpi*
          retention-days: 14

  # The bridge is shared with the macOS app: the unit tests run on macOS too. (The prompt runner here is the
  # Omarchy launcher's; the Mac app has a copy of its own, tested by macos.yml.) The QML launcher, the lint
  # and the .xpi stay on Linux.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The prompt runner's packages
        run: npm ci --prefix daemon --no-audit --no-fund

      - name: Unit tests
        run: make test
