name: macOS app

# The Mac app (macos/): on changes to it, to the contracts it reads, or to this workflow.
on:
  push:
    branches: [master]
    tags: ["macos-v*"] # a release (paths aren't checked for tags)
    paths: ["macos/**", "contracts/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "contracts/**", ".github/workflows/macos.yml"]

permissions:
  contents: read

# bash -eo pipefail: a failing xcodebuild fails the step even when piped into xcbeautify.
defaults:
  run:
    shell: bash
    working-directory: macos

jobs:
  # The app's own view logic and runner (macos/js, macos/runner), and the contracts it reads.
  js:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The runner's packages
        run: npm ci --prefix runner --no-audit --no-fund
      - name: The app's JavaScript tests
        run: node --test js/tests/*.test.js
      - name: The reading companion (its server, the kit the app carries, Tailscale's link)
        run: node --test companion/tests/*.test.mjs
      - name: Goldens are current
        run: node scripts/goldens.mjs --check
      - name: Parity with the Omarchy launcher's actions (every phase done so far fully ported)
        run: scripts/parity.sh --phase 3b --phase 4a --phase 4b --phase 5 --phase 6 --phase 7 --phase 8 --phase 9
      - name: The sync contract it reads
        working-directory: .
        run: node --test contracts/tests/*.test.js
      - name: The two launchers stay apart
        working-directory: .
        run: scripts/check-boundaries.sh

  # The real app on screen, on the fixtures (no Zotero, no runner): a failing flow fails the check, PLAN.md › Testing.
  # A job of its own, beside the build: it takes most of the time (about 17 minutes), so the build and the release
  # don't wait for it. Not for a tag: its commit was checked on master. Nor for a pull request that changes no code
  # (notes, docs, the version number): there's nothing new on screen.
  ui:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (the base branch, to see what the pull request changes)

      - name: Code changed?
        id: changes
        env:
          BASE: ${{ github.base_ref }}
        run: |
          code=1
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            code=0
            files=$(git diff --name-only "origin/$BASE...HEAD")
            while IFS= read -r f; do
              case $f in
                "") ;;
                *.md | macos/docs/*) ;;
                macos/project.yml) # (only its version numbers: no code)
                  lines=$(git diff -U0 "origin/$BASE...HEAD" -- "$f" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true)
                  others=$(grep -vE '^[+-][[:space:]]*(MARKETING_VERSION|CURRENT_PROJECT_VERSION):' <<<"$lines" || true)
                  [[ -z $others ]] || code=1 ;;
                *) code=1 ;;
              esac
            done <<<"$files"
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          [[ $code == 1 ]] || echo "No code changed: the UI tests aren't run."

      - name: XcodeGen
        if: steps.changes.outputs.code == '1'
        run: brew install xcodegen xcbeautify && xcodegen generate

      # (the raw log kept: xcbeautify drops XCTest's timeline, which says where each test's time goes)
      - name: The app on screen (fixtures)
        if: steps.changes.outputs.code == '1'
        run: |
          xcodebuild test -project ZoteroLauncher.xcodeproj -scheme ZoteroLauncherUITests \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build 2>&1 | tee "$RUNNER_TEMP/ui.log" | xcbeautify

      - name: Where the UI tests' time goes
        if: always() && steps.changes.outputs.code == '1'
        run: grep -E "^[[:space:]]+t = |^Test Case '.*' (started|passed|failed)" "$RUNNER_TEMP/ui.log" || true

  build:
    runs-on: macos-15
    permissions:
      contents: write # the nightly release
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: brew install xcodegen xcbeautify && xcodegen generate

      - name: Unit tests
        run: |
          xcodebuild test -project ZoteroLauncher.xcodeproj -scheme ZoteroLauncher \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build | xcbeautify

      # Universal: Apple silicon and Intel Macs. The check fails the build if either is missing.
      - name: Build the app (universal, ad-hoc signed)
        run: |
          xcodebuild build -project ZoteroLauncher.xcodeproj -scheme ZoteroLauncher -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO | xcbeautify
          APP=build/Build/Products/Release/ZoteroLauncher.app
          archs=$(lipo -archs "$APP/Contents/MacOS/ZoteroLauncher")
          echo "architectures: $archs"
          [[ $archs == *arm64* && $archs == *x86_64* ]] || { echo "not universal: $archs" >&2; exit 1; }
          plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist"
          ditto -c -k --keepParent "$APP" ZoteroLauncher.zip

      # The installer, on the zip just built: what you run is what CI checked.
      - name: Install from the zip
        run: DEST="$RUNNER_TEMP/Applications" NO_OPEN=1 scripts/install.sh ZoteroLauncher.zip

      # GitHub wraps every artifact in a zip of its own: this one is a zip in a zip, for checking a
      # pull request's build. To try the app, use the nightly release below: one plain zip.
      - uses: actions/upload-artifact@v4
        with:
          name: ZoteroLauncher-zipped-twice
          path: ZoteroLauncher.zip
          retention-days: 14

      - name: Nightly release (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete macos-nightly --yes --cleanup-tag || true
          gh release create macos-nightly ZoteroLauncher.zip scripts/install.sh --prerelease --target "$GITHUB_SHA" \
            --title "macOS app: nightly" --notes "The Mac app, built from ${GITHUB_SHA::7}, the latest commit on master that touched it. Signed ad hoc, not notarized: install it with install.sh (macos/README.md)."

      # A release: a new version on master (MARKETING_VERSION in project.yml, its notes in docs/releases/macos-v<version>.md),
      # tagged macos-v<version> on that commit, or a macos-v tag pushed by hand. A version already released is skipped.
      # With the app's zip and its install.sh, the newest Zotero bridge (.xpi and .sha256, copied from its vX.Y.Z
      # release: the same file Zotero's updates.json names), so both are found in one place.
      - name: Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/macos-v'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw build/Build/Products/Release/ZoteroLauncher.app/Contents/Info.plist)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=$GITHUB_REF_NAME
            [[ $version == "${tag#macos-v}" ]] || { echo "the app's version ($version) isn't the tag's" >&2; exit 1; }
            where=(--verify-tag)
          else
            tag="macos-v$version"
            where=(--target "$GITHUB_SHA")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already released"; exit 0; fi
          notes="docs/releases/$tag.md"
          [[ -f $notes ]] || { echo "no release notes: $notes" >&2; exit 1; }
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          sed -e "s|^TAG=\${ZL_TAG:-macos-nightly}|TAG=\${ZL_TAG:-$tag}|" -e "s|releases/download/macos-nightly/|releases/download/$tag/|" \
            scripts/install.sh > "$out/install.sh"
          grep -q "^TAG=\${ZL_TAG:-$tag}" "$out/install.sh"
          bridge=$(gh release list --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '[.[].tagName | select(test("^v[0-9]"))][0] // ""')
          [[ -n $bridge ]] || { echo "no bridge release (vX.Y.Z) to attach" >&2; exit 1; }
          # (v0.2.2 carries the file under its old name too: the current name only, when it's there)
          gh release download "$bridge" --pattern 'zotero-companion-bridge-*' --dir "$out/bridge" ||
            gh release download "$bridge" --pattern '*.xpi' --pattern '*.xpi.sha256' --dir "$out/bridge"
          ls "$out"/bridge/*.xpi "$out"/bridge/*.xpi.sha256 >/dev/null
          { cat "$notes"; printf '\n**The Zotero bridge** (%s) is attached too: in Zotero, *Tools → Plugins → ⚙ → Install Plugin From File…*, then pick the .xpi. Installed bridges update themselves.\n' "$bridge"; } >"$out/notes.md"
          gh release create "$tag" ZoteroLauncher.zip "$out/install.sh" "$out"/bridge/* "${where[@]}" \
            --title "macOS app $version" --notes-file "$out/notes.md"
